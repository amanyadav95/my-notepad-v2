<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my-notepad</title>
    <link rel="icon" type="image/svg" href="favicon.svg">
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="manifest" href="manifest.json">
</head>
<style>
    .side-nev {
        min-height: 665px !important;
        /* Sidebar = full viewport height (leaves room for row margin + footer);
           the card body inside scrolls when content is taller */
        height: calc(100vh - 4rem);
        height: calc(100dvh - 4rem);
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .side-nev .card-body {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow-y: auto; /* safety net — normally only #indexListing scrolls */
    }
    /* Only the notes list scrolls; it takes all remaining sidebar height */
    #indexListing {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: thin;              /* Firefox */
        scrollbar-color: #adb5bd transparent;
    }
    /* Thin 4px scrollbar (Chrome / Edge / Safari) */
    #indexListing::-webkit-scrollbar { width: 4px; }
    #indexListing::-webkit-scrollbar-track { background: transparent; }
    #indexListing::-webkit-scrollbar-thumb { background: #adb5bd; border-radius: 2px; }
    #indexListing::-webkit-scrollbar-thumb:hover { background: #86939e; }
    .hide{
        display: none;
    }
    .border-l-b {
        border-left: 1px solid #dee2e6;
        border-bottom: 1px solid #dee2e6;
    }
    #body {
        background-color: #fff;
    }
    .active-note-btn {
        background-color: #0d6efda6 !important;
        color: #fff !important;
        border: 1px solid #0d6efda6 !important;
    }
    .active-note-div {
        display: block;
        border-color: #0d6efda6;
    }
    .active-file {
        color: #61a1fe !important;
        font-weight: bold;
        border-left: 2px solid #61a1fe !important;
    }
    .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 1040;
    }
    .mobile-topbar {
        background: var(--bs-body-bg, #fff);
    }
    @media (max-width: 767.98px) {
        .side-nev-col {
            position: fixed;
            top: 0;
            left: -85%;
            width: 85%;
            max-width: 320px;
            height: 100%;
            z-index: 1050;
            transition: left 0.25s ease-in-out;
            overflow-y: auto;
            padding: 0;
        }
        .side-nev-col.open {
            left: 0;
        }
        .side-nev-col.open ~ .sidebar-overlay,
        .sidebar-overlay.show {
            display: block;
        }
        .side-nev {
            height: 100%;
            border-radius: 0;
        }
        .side-nev h3 {
            font-size: 1rem; /* match the mobile top bar branding size */
        }
    }
    .form-control:focus{
        box-shadow: none;
    }
    /* Sync-now pulse: visible reminder while Drive permission is still missing */
    @keyframes gsPermissionPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(13, 110, 253, .45); }
        50% { box-shadow: 0 0 0 6px rgba(13, 110, 253, 0); }
    }
    #gsSyncNow.gs-needs-permission {
        font-weight: 600;
        animation: gsPermissionPulse 1.5s infinite;
    }

    /* ---- Editor fills the screen height ----
       Page stacks as: [mobile top bar] + [row], total = viewport height.
       The row grows to fill the leftover space, and the textarea stretches
       inside it, so the footer always sits at the bottom of the screen. */
    .app-wrap {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
    }
    .app-wrap > .row {
        flex: 1 1 auto;
        min-height: 0;
    }
    .editor-col {
        display: flex;
        min-height: 0;
    }
    .editor-wrap {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
    }
    /* Title bar and footer keep their natural size */
    .editor-wrap .input-group,
    .editor-wrap footer {
        flex: 0 0 auto;
    }
    /* Textarea takes all remaining vertical space */
    #fileText {
        flex: 1 1 auto;
        min-height: 120px;
        resize: none;
    }
</style>
<body>
    <div class="app-wrap">
        <!-- Mobile top bar: only visible below md breakpoint -->
        <div class="d-md-none d-flex align-items-center p-2 border-bottom mobile-topbar">
            <button id="sidebarToggle" class="btn btn-outline-secondary btn-sm me-2" type="button" onclick="toggleSidebar()" aria-label="Toggle notes menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-list" viewBox="0 0 16 16">
                   <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
                </svg>
            </button>
            <strong>My-NoTeS</strong>
        </div>
        <!-- Dark backdrop shown behind the sidebar on mobile -->
        <div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
        <div class="row m-1">
            <div class="col-12 col-md-3 col-lg-2 side-nev-col" id="sideNevCol">
            <div class="card side-nev">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <h3 class="text-light-emphasis mb-0">My-NoTeS</h3>
                        <button type="button" class="btn btn-sm btn-outline-secondary d-md-none close-sidebar-btn" onclick="closeSidebar()" aria-label="Close menu">&times;</button>
                    </div>
                    <button id="newNote" type="button" class="btn btn-outline-secondary btn-sm w-100 mb-2 mt-2">+ New Note</button>
                    <div class="input-group input-group-sm mb-2">
                        <input id="newNoteTitle" type="text"  class="form-control input-group-sm hide" placeholder="Type title here" maxlength="30">
                        <button id="newNoteAdd" type="button" class="btn btn-sm btn-outline-primary hide">Add</button>
                    </div>
                    <div id="indexListing"></div>
                    <button id="update-btn" type="button" class="btn btn-sm btn-outline-primary w-100 my-2" style="display:none;">
                        Update available — click to refresh
                    </button>
                    <div id="gsSection" class="border-top mt-2 pt-2">
                        <small class="text-muted fw-semibold d-block mb-1">Google Sync</small>
                        <div id="gsSignedOut">
                            <div id="gsGoogleBtn" aria-labelledby="button-label"></div>
                            <span id="button-label" class="visually-hidden">Sign in with Google</span>
                            <small class="text-muted d-block mt-1">Sign in to back up your notes to your Google Drive.</small>
                        </div>
                        <div id="gsSignedIn" style="display:none;">
                            <div class="d-flex align-items-center mb-2">
                                <img id="gsAvatar" src="" alt="" class="rounded-circle me-2" width="24" height="24" onerror="this.style.display='none'">
                                <small id="gsName" class="text-truncate fw-semibold"></small>
                            </div>
                            <div class="d-flex gap-1">
                                <button id="gsSyncNow" type="button" class="btn btn-sm btn-outline-primary flex-fill">Sync now</button>
                                <button id="gsRestore" type="button" class="btn btn-sm btn-outline-secondary flex-fill">Restore</button>
                            </div>
                            <button id="gsSignOut" type="button" class="btn btn-sm btn-outline-danger w-100 mt-1">Sign out</button>
                            <small id="gsLastSync" class="text-muted d-block mt-1"></small>
                            <small id="gsError" class="text-danger d-block mt-1" style="display:none;"></small>
                        </div>
                    </div>
                </div>
            </div>
            </div>
            <div class="col-12 col-md-9 col-lg-10 editor-col">
              <div class="editor-wrap">
                <div class="input-group mb-1">
                  <input type="text" id="fileTitle" class="form-control" placeholder="Title" aria-label="Title" aria-describedby="saveNote" disabled>
                  <button class="btn btn-outline-secondary" type="button" id="saveNote"></button>
                </div>
                <textarea class="form-control" id="fileText" rows="24" disabled></textarea>
                <footer class="text-center text-muted small border-top py-2 mt-2">
                    <a href="http://www.linkedin.com/in/aman-yadav-3ab0a018a" class="float-end text-decoration-none" style="margin-left: 10px" target="_blank" rel="noopener noreferrer"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-linkedin" viewBox="0 0 16 16">
                    <path d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854zm4.943 12.248V6.169H2.542v7.225zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248S2.4 3.226 2.4 3.934c0 .694.521 1.248 1.327 1.248zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016l.016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225z"/>
                    </svg> linkedin</a>
                    <a href="terms.html" class="float-end text-decoration-none">Terms &amp; Conditions</a>
                </footer>
              </div>
            </div>
        </div>
        <div class="toast-container position-fixed top-0 end-0 p-3">
          <div id="liveToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
              <div id="toastBody" class="toast-body">
                </div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
          </div>
        </div>
        <!-- Confirm toast (centered on screen) -->
        <div class="toast-container position-fixed top-50 start-50 translate-middle p-3" style="z-index: 1100;">
          <div class="toast" id="confirmToast" role="alert" aria-live="assertive" aria-atomic="true" style="min-width: 280px; background-color: #fff;">
            <div class="toast-body">
              <p id="confirmToastBody" class="mb-2">Are you sure?</p>
              <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-danger btn-sm" id="toastTakeAction">Delete</button>
                <button type="button" class="btn btn-secondary btn-sm" id="toastCloseBtn">Cancel</button>
              </div>
            </div>
          </div>
        </div>
    </div>
    <script src="bootstrap.bundle.min.js"></script>
    <script src="jquery-4.0.0.min.js"></script>
    <script src="popper.min.js"></script>
    <script src="pwa-update.js"></script>
    <script src="app.js"></script>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="google-sync.js"></script>
</body>
</html>
